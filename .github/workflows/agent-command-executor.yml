name: Agent Command Executor

on:
  workflow_run:
    workflows: ['Agent Command Intake']
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: agent-command-gateway
  cancel-in-progress: false
  queue: max

jobs:
  execute:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'agent-command-gateway' &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted executor from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Execute validated command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATEWAY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GATEWAY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GATEWAY_ACTOR: ${{ github.event.workflow_run.actor.login }}
          GATEWAY_EXPECTED_ACTOR: ${{ github.repository_owner }}
          GATEWAY_INTAKE_RUN_ID: ${{ github.event.workflow_run.id }}
          GATEWAY_EXECUTOR_RUN_ID: ${{ github.run_id }}
          GATEWAY_EXECUTOR_MAIN_SHA: ${{ github.sha }}
        run: python scripts/agent_command_gateway.py execute
