name: Repository Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate repository governance
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python scripts/validate_repository.py

      - name: Test Agent Command Gateway
        run: python -m unittest -v scripts/test_agent_command_gateway.py
